name: ClinicOS Staging CI/CD Pipeline

on:
  push:
    branches:
      - staging
      - main

jobs:
  audit-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            dermacare-platform/backend/package-lock.json
            clinicos-frontend/package-lock.json

      - name: Audit Backend
        run: |
          cd dermacare-platform/backend
          npm ci
          npm run build

      - name: Audit Frontend
        run: |
          cd clinicos-frontend
          npm ci
          npm run build

  build-and-push:
    needs: audit-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./dermacare-platform/backend
          file: ./dermacare-platform/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./clinicos-frontend
          file: ./clinicos-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-staging:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: SSH Deploy to Staging VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            echo "Navigating to app directory..."
            cd /home/ubuntu/clinicos/deployment
            
            echo "Logging in to GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "Recreating backend and frontend containers..."
            docker compose -f docker-compose.prod.yml up -d --no-deps backend frontend
            
            echo "Running database schema migrations..."
            docker exec clinicos-backend npx prisma db push
            
            echo "Running database seeds (if any)..."
            docker exec clinicos-backend npx prisma db seed || echo "Seeding skipped or already applied"
            
            echo "Clean up unused images..."
            docker image prune -f
            
            echo "STAGING DEPLOYMENT COMPLETED SUCCESSFULLY!"
