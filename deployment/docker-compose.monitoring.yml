version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: clinicos-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - clinicos-net
      - monitoring-net
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.3.3
    container_name: clinicos-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_secure_pass_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring-net
    ports:
      - "127.0.0.1:3002:3000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: clinicos-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: clinicos-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: clinicos-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${DB_USER}
      DATA_SOURCE_PASS: ${DB_PASSWORD}
    networks:
      - clinicos-net
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: clinicos-redis-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: redis://redis:6379
    networks:
      - clinicos-net
      - monitoring-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

networks:
  clinicos-net:
    external: true
  monitoring-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
