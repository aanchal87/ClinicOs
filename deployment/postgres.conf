# ClinicOS PostgreSQL Staging/Production Configuration
# Target: 4GB RAM, 2 vCPUs, SSD Storage

# Connection Settings
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 1GB                  # 25% of RAM
work_mem = 10MB                       # Memory per query sort/hash operations
maintenance_work_mem = 256MB          # Memory for indexing, vacuuming
dynamic_shared_memory_type = posix

# Cache Tuning
effective_cache_size = 3GB            # 75% of RAM

# Write Ahead Log (WAL) Tuning
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
min_wal_size = 1GB
max_wal_size = 4GB

# Query Planner / Optimizer
random_page_cost = 1.1                 # Optimized for SSDs (Default is 4.0 for HDD)
effective_io_concurrency = 200        # Concurrent IO requests for SSDs
default_statistics_target = 100

# Logging Configurations
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'none'                 # Don't log all statements (security/GDPR)
log_min_duration_statement = 250      # Log slow queries taking longer than 250ms
log_line_prefix = '%m [%p] %q%u@%d '   # Format prefixes: timestamp [pid] user@db
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0                     # Log all temp files created for queries

# Autovacuum settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
