
services:
  db:
    image: postgres:15-alpine
    container_name: clinicos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinicos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinicos-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./dermacare-platform/backend
      dockerfile: Dockerfile
    container_name: clinicos-backend
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_PATH: ${STORAGE_PATH}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - backend_uploads:${STORAGE_PATH}

  frontend:
    build:
      context: ./clinicos-frontend
      dockerfile: Dockerfile
    container_name: clinicos-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_uploads:
